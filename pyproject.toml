[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyeda-mahn"
version = "0.1.0"
description = "Encoder and parser for the German EDA-Mahn automated court dunning fixed-width format."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Optimaite" }]
maintainers = [{ name = "Optimaite", email = "opensource@optimaite.eu" }]
keywords = ["mahnverfahren", "eda", "mahnbescheid", "vollstreckungsbescheid", "legal", "germany"]
dependencies = ["pydantic>=2.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Optimaite/pyeda-mahn"
Repository = "https://github.com/Optimaite/pyeda-mahn"
Issues = "https://github.com/Optimaite/pyeda-mahn/issues"
Changelog = "https://github.com/Optimaite/pyeda-mahn/releases"

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "twine>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pyeda_mahn"]

[tool.hatch.build.targets.wheel.force-include]
"pyeda_mahn/py.typed" = "pyeda_mahn/py.typed"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
